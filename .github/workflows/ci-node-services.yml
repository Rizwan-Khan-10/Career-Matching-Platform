name: CI - Node Services

on:
  push:
    paths: ['apps/*-service/**', 'apps/websocket-gateway/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/ci-node-services.yml']
  pull_request:
    paths: ['apps/*-service/**', 'apps/websocket-gateway/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/ci-node-services.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - resume-service
          - job-service
          - matching-results-service
          - notification-service
          - websocket-gateway
          - chat-service
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: |
          if [ -f "apps/${{ matrix.service }}/prisma/schema.prisma" ]; then
            pnpm --filter ${{ matrix.service }} exec prisma generate
          fi
      - run: pnpm --filter ${{ matrix.service }} run build
      - run: pnpm --filter ${{ matrix.service }} run test