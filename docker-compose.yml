name: career-matching

# Run:  docker compose --env-file .env.compose up --build        (copy .env.compose.example to .env.compose first)
# Only nginx publishes a port. Everything else talks over the default compose network by service name.

x-healthy: &healthy
  condition: service_healthy

x-infra-env: &infra-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.compose}@postgres:5432/${POSTGRES_DB:-career_matching}
  REDIS_URL: redis://redis:6379

x-nest-env: &nest-env
  <<: *infra-env
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.compose}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env.compose}
  WEB_URL: ${PUBLIC_URL:-http://localhost}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ENABLE_DOCS: "false"

x-agent-env: &agent-env
  <<: *infra-env
  GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env.compose}
  GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
  GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-low}
  LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
  ENABLE_DOCS: "false"

x-cloudinary: &cloudinary
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?set CLOUDINARY_CLOUD_NAME in .env.compose}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?set CLOUDINARY_API_KEY in .env.compose}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?set CLOUDINARY_API_SECRET in .env.compose}

configs:
  pg_init:
    content: |
      CREATE EXTENSION IF NOT EXISTS vector;

volumes:
  pgdata:
  redisdata:
  e2e_node_modules:

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.compose}
      POSTGRES_DB: ${POSTGRES_DB:-career_matching}
    configs:
      - source: pg_init
        target: /docker-entrypoint-initdb.d/00-vector.sql
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- NestJS services (build context = repo root)
  user-service:
    build: { context: ., dockerfile: apps/user-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: [*nest-env, *cloudinary]
      PORT: "3002"
    depends_on:
      postgres: *healthy
      redis: *healthy

  auth-service:
    build: { context: ., dockerfile: apps/auth-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *nest-env
      PORT: "3001"
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env.compose}
      USER_SERVICE_URL: http://user-service:3002
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env.compose}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env.compose}
      SEED_ADMIN_ON_BOOT: "true"
    depends_on:
      postgres: *healthy
      redis: *healthy
      user-service: *healthy

  resume-service:
    build: { context: ., dockerfile: apps/resume-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: [*nest-env, *cloudinary]
      PORT: "3003"
    depends_on:
      postgres: *healthy
      redis: *healthy

  job-service:
    build: { context: ., dockerfile: apps/job-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: [*nest-env, *cloudinary]
      PORT: "3004"
      USER_SERVICE_URL: http://user-service:3002
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      postgres: *healthy
      redis: *healthy
      user-service: *healthy
      auth-service: *healthy

  matching-results-service:
    build: { context: ., dockerfile: apps/matching-results-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *nest-env
      PORT: "3005"
    depends_on:
      postgres: *healthy
      redis: *healthy
      user-service: *healthy
      job-service: *healthy

  notification-service:
    build: { context: ., dockerfile: apps/notification-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *nest-env
      PORT: "3006"
      AUTH_SERVICE_URL: http://auth-service:3001
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-gmail}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_DEV_REDIRECT_TO: ${EMAIL_DEV_REDIRECT_TO:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_FROM_NAME: ${GMAIL_FROM_NAME:-Career Matching}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      postgres: *healthy
      redis: *healthy
      auth-service: *healthy

  websocket-gateway:
    build: { context: ., dockerfile: apps/websocket-gateway/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *nest-env
      PORT: "3007"
    depends_on:
      redis: *healthy

  chat-service:
    build: { context: ., dockerfile: apps/chat-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *nest-env
      PORT: "3008"
      CHATBOT_AGENT_URL: http://chatbot-agent:8000
      MATCHING_SERVICE_URL: http://matching-results-service:3005
      JOB_SERVICE_URL: http://job-service:3004
      CHAT_RATE_PER_MINUTE: ${CHAT_RATE_PER_MINUTE:-10}
      CHAT_RATE_PER_DAY: ${CHAT_RATE_PER_DAY:-200}
    depends_on:
      postgres: *healthy
      redis: *healthy
      chatbot-agent: *healthy
      matching-results-service: *healthy
      job-service: *healthy

  # ---------------------------------------------------------------- Python agents (build context = the agent folder, port 8000 inside)
  resume-parser-agent:
    build: { context: apps/resume-parser-agent }
    restart: unless-stopped
    environment:
      <<: [*agent-env, *cloudinary]
      ENABLE_RESUME_PARSER_CONSUMER: "true"
      ENABLE_RESUME_PDF_CONSUMER: "true"
    depends_on:
      postgres: *healthy
      redis: *healthy
      resume-service: *healthy

  jd-extractor-agent:
    build: { context: apps/jd-extractor-agent }
    restart: unless-stopped
    environment:
      <<: *agent-env
      ENABLE_JD_EXTRACTOR_CONSUMER: "true"
    depends_on:
      postgres: *healthy
      redis: *healthy
      job-service: *healthy

  matching-agent:
    build: { context: apps/matching-agent }
    restart: unless-stopped
    environment:
      <<: *infra-env
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env.compose}
      EMBEDDING_BACKEND: minilm
      APP_ENV: production
      LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      ENABLE_DOCS: "false"
      ENABLE_MATCHING_CONSUMER: "true"
    volumes:
      - ./apps/matching-agent/app/artifacts:/app/app/artifacts:ro
    depends_on:
      postgres: *healthy
      redis: *healthy
      resume-service: *healthy
      job-service: *healthy
      user-service: *healthy

  feedback-agent:
    build: { context: apps/feedback-agent }
    restart: unless-stopped
    environment:
      <<: *agent-env
      ENABLE_FEEDBACK_CONSUMER: "true"
    depends_on:
      postgres: *healthy
      redis: *healthy
      matching-results-service: *healthy

  chatbot-agent:
    build: { context: apps/chatbot-agent }
    restart: unless-stopped
    environment:
      <<: *agent-env
    depends_on:
      postgres: *healthy
      redis: *healthy
      matching-results-service: *healthy
      job-service: *healthy
      resume-service: *healthy

  # ---------------------------------------------------------------- web + the only published port
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # inlined into the browser bundle at build time: change PUBLIC_URL, then run `up --build` again
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_URL:-http://localhost}
        NEXT_PUBLIC_USE_MOCKS: "false"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.docker.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web: *healthy
      auth-service: *healthy
      user-service: *healthy
      resume-service: *healthy
      job-service: *healthy
      matching-results-service: *healthy
      notification-service: *healthy
      websocket-gateway: *healthy
      chat-service: *healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------- e2e (only with --profile e2e)
  e2e:
    profiles: ["e2e"]
    image: node:22-slim
    working_dir: /repo
    volumes:
      # only what the suite needs; node_modules stays in a volume so nothing is written into your working copy
      - ./e2e:/repo/e2e
      - ./package.json:/repo/package.json:ro
      - ./pnpm-lock.yaml:/repo/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/repo/pnpm-workspace.yaml:ro
      - e2e_node_modules:/repo/node_modules
    environment:
      E2E_BASE_URL: http://nginx
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env.compose}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env.compose}
      E2E_REDIS_URL: redis://redis:6379
      E2E_MATCHING_AGENT_URL: http://matching-agent:8000
      E2E_INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env.compose}
      E2E_WAIT_MS: ${E2E_WAIT_MS:-120000}
      E2E_QUIET_MS: ${E2E_QUIET_MS:-10000}
    depends_on:
      nginx: *healthy
      matching-agent: *healthy
      redis: *healthy
    command: ["sh", "-c", "npm install -g pnpm@10.34.7 && pnpm install --frozen-lockfile --ignore-scripts && pnpm e2e"]