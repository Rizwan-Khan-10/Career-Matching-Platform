events {}

http {
  server {
    listen 80;

    location /auth/ {
      proxy_pass http://host.docker.internal:3001;
      proxy_set_header Host $host;
    }

    location /users/ {
      proxy_pass http://host.docker.internal:3002;
      proxy_set_header Host $host;
    }

    location /resumes/ {
      proxy_pass http://host.docker.internal:3003;
      proxy_set_header Host $host;
    }

    location /jobs/ {
      proxy_pass http://host.docker.internal:3004;
      proxy_set_header Host $host;
    }

    location /matches/ {
      proxy_pass http://host.docker.internal:3005;
      proxy_set_header Host $host;
    }

    location /chat/ {
      proxy_pass http://host.docker.internal:3008;
      proxy_set_header Host $host;
    }

    location /socket.io/ {
      proxy_pass http://host.docker.internal:3007/socket.io;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}