events {}

http {
  client_max_body_size 12m;            # multer limit is 10 MB; default 1 MB blocked normal resumes with a 413

  # per-IP request limits: a cheap extra layer on top of the login lock / sign-up limits inside auth-service.
  # Generous on purpose (normal use and the e2e tests stay far below); excess requests get 429.
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=chat_zone:10m rate=5r/s;
  limit_req_status 429;

  server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # service-to-service endpoints must never be reachable from outside
    location /internal/ { return 404; }

    location /auth/       { limit_req zone=auth_zone burst=40 nodelay; proxy_pass http://host.docker.internal:3001; }
    location /applicants/ { proxy_pass http://host.docker.internal:3002; }
    location /companies/  { proxy_pass http://host.docker.internal:3002; }
    location /admin/      { proxy_pass http://host.docker.internal:3002; }
    location /resumes/    { proxy_pass http://host.docker.internal:3003; }
    location /jobs/       { proxy_pass http://host.docker.internal:3004; }
    location /matches/    { proxy_pass http://host.docker.internal:3005; }
    location /stats/      { proxy_pass http://host.docker.internal:3005; }


    # notification-service. The list call is `GET /notifications?limit=20` (no trailing slash): the prefix
    # `/notifications/` alone would answer it with a 301 redirect, so the bare path gets its own exact location.
    location = /notifications { proxy_pass http://host.docker.internal:3006; }
    location /notifications/   { proxy_pass http://host.docker.internal:3006; }

    location /chat/ {
      limit_req zone=chat_zone burst=10 nodelay;
      proxy_pass http://host.docker.internal:3008;
      proxy_read_timeout 90s;          # the assistant may take > 60 s when Groq retries
    }

    location /socket.io/ {
      proxy_pass http://host.docker.internal:3007;     # no URI part: the original path is passed through unchanged
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }
  }
}