# nginx for Docker Compose: one origin (port 80) for the browser. Upstreams use the compose service names.
# Local (non-Docker) setup keeps using infra/nginx/nginx.conf.
events {}

http {
  server_tokens off;
  client_max_body_size 12m;            # multer limit is 10 MB; default 1 MB blocked normal resumes with a 413

  upstream web_app          { server web:3000; }
  upstream auth_api         { server auth-service:3001; }
  upstream user_api         { server user-service:3002; }
  upstream resume_api       { server resume-service:3003; }
  upstream job_api          { server job-service:3004; }
  upstream matching_api     { server matching-results-service:3005; }
  upstream notification_api { server notification-service:3006; }
  upstream websocket_gw     { server websocket-gateway:3007; }
  upstream chat_api         { server chat-service:3008; }

  # WebSocket upgrade only when the client asks for it (socket.io also uses plain long polling)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # /admin/... is BOTH a web page and a user-service API with the same paths (/admin/companies, /admin/audit, ...).
  # A page request goes to the web app, everything else to the API. Page requests are:
  #   - browser navigation: Accept contains text/html
  #   - Next.js client navigation: header `RSC: 1`
  #   - Next.js prefetch: query `_rsc=...`
  # Rules are checked in order; "#" separates Accept, RSC header and _rsc query.
  map "$http_accept#$http_rsc#$arg__rsc" $admin_backend {
    default          user_api;
    "~*text/html"    web_app;
    "~^[^#]*#1#"     web_app;
    "~#[^#]+$"       web_app;
  }

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;   # one id per request, picked up by the services' JSON logs

    # service-to-service endpoints must never be reachable from outside
    location /internal/ { return 404; }

    location /auth/       { proxy_pass http://auth_api; }
    location /applicants/ { proxy_pass http://user_api; }
    location /companies/  { proxy_pass http://user_api; }
    location /admin/      { proxy_pass http://$admin_backend; }
    location /resumes/    { proxy_pass http://resume_api; }
    location /jobs/       { proxy_pass http://job_api; }
    location /matches/    { proxy_pass http://matching_api; }
    location /stats/      { proxy_pass http://matching_api; }

    # notification-service. The list call is `GET /notifications?limit=20` (no trailing slash): the prefix
    # `/notifications/` alone would answer it with a 301 redirect, so the bare path gets its own exact location.
    location = /notifications { proxy_pass http://notification_api; }
    location /notifications/   { proxy_pass http://notification_api; }

    location /chat/ {
      proxy_pass http://chat_api;
      proxy_read_timeout 90s;          # the assistant may take > 60 s when Groq retries
    }

    location /socket.io/ {
      proxy_pass http://websocket_gw;  # no URI part: the original path is passed through unchanged
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 3600s;
    }

    # everything else is the Next.js web app (pages, /_next/ assets), so the browser has one origin
    location / {
      proxy_pass http://web_app;
    }
  }
}