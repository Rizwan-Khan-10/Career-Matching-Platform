packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  esbuild: false
  msgpackr-extract: false
  prisma: false
  unrs-resolver: true
overrides:
  multer: ">=2.4.0"
  proxy-addr: ">=2.0.8"
  follow-redirects: ">=1.16.1"
  sharp: ">=0.35.5"
  mysql2: ">=3.23.1"
  source-map-js: ">=1.2.2"
  fast-uri: ">=3.1.8"
  deepmerge-ts: ">=8.0.0"
